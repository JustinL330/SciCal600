def buildNumber = System.getenv('SCICAL_VERSION_CODE') ?: '1'
if (!(buildNumber ==~ /[0-9]+/)) throw new GradleException('Invalid version code')
def packageVersion = new groovy.json.JsonSlurper().parse(file("$rootDir/../package.json")).version
def buildVersionName = System.getenv('SCICAL_VERSION_NAME')
    ?: (System.getenv('SCICAL_VERSION_CODE') ? "${packageVersion}-dev.${buildNumber}" : packageVersion)
def testingSigning = [
    storeFile: System.getenv('SCICAL_TEST_KEYSTORE'),
    storePassword: System.getenv('SCICAL_TEST_STORE_PASSWORD'),
    keyAlias: System.getenv('SCICAL_TEST_KEY_ALIAS'),
    keyPassword: System.getenv('SCICAL_TEST_KEY_PASSWORD'),
]
def suppliedTestingSigningValues = testingSigning.values().count { it }
if (suppliedTestingSigningValues != 0 && suppliedTestingSigningValues != testingSigning.size()) {
    throw new GradleException('Android testing signing requires a keystore, store password, key alias and key password')
}
android {
    if (suppliedTestingSigningValues == testingSigning.size()) {
        signingConfigs {
            scicalTesting {
                storeFile file(testingSigning.storeFile)
                storePassword testingSigning.storePassword
                keyAlias testingSigning.keyAlias
                keyPassword testingSigning.keyPassword
            }
        }
        buildTypes {
            debug {
                signingConfig signingConfigs.scicalTesting
            }
        }
    }
    defaultConfig {
        versionCode buildNumber.toInteger()
        versionName buildVersionName
    }
}
// The testing and production signing identities are intentionally separate.
// Production releases continue to use apksigner only after their protected gates.

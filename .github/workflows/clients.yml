name: Desktop and iOS clients

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run brand:check

  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: SciCal600-macOS
            build_arg: --mac
          - os: windows-latest
            artifact: SciCal600-Windows
            build_arg: --win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run desktop:prepare
      - name: Package desktop app
        shell: bash
        run: cd .desktop-build && ../node_modules/.bin/electron-builder --config electron-builder.yml ${{ matrix.build_arg }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: client-artifacts/desktop/*
          if-no-files-found: error
          retention-days: 90

  ios-simulator:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run ios:sync
      - name: Build unsigned iOS Simulator app
        run: |
          rm -rf client-artifacts/ios
          mkdir -p client-artifacts/ios
          if [[ -d ios/App/App.xcworkspace ]]; then
            XCODE_CONTAINER=(-workspace ios/App/App.xcworkspace)
          else
            XCODE_CONTAINER=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild "${XCODE_CONTAINER[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath client-artifacts/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="client-artifacts/ios/DerivedData/Build/Products/Release-iphonesimulator/App.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" client-artifacts/SciCal600-iOS-Simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: SciCal600-iOS-Simulator
          path: client-artifacts/SciCal600-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 90

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [desktop, ios-simulator]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: client-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SciCal600-*
          path: release-assets
          merge-multiple: true
      - name: Collect installable release files and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish-assets
          while IFS= read -r -d '' file; do
            cp "$file" "publish-assets/$(basename "$file")"
          done < <(find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.ipa' \) -print0)
          test "$(find publish-assets -maxdepth 1 -type f | wc -l)" -ge 3
          (cd publish-assets && sha256sum * > SHA256SUMS)
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            TITLE="SciCal600 $GITHUB_REF_NAME"
            PRERELEASE=""
          else
            RELEASE_TAG="client-${GITHUB_SHA:0:12}"
            TITLE="SciCal600 clients (${GITHUB_SHA:0:12})"
            PRERELEASE="--prerelease"
          fi
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" $PRERELEASE --title "$TITLE" --notes "Automated SciCal600 client builds. macOS and Windows packages are unsigned. The iOS asset is an unsigned Simulator build; physical iPhone/iPad installation requires Apple code signing. Android builds are published by the Android workflow."
          gh release upload "$RELEASE_TAG" publish-assets/* --clobber

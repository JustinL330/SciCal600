name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://scical600.pages.dev

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions repository secrets."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Preserve latest verified Android download mirror
        run: |
          set -euo pipefail
          PUBLIC_BASE=https://scical600.pages.dev/downloads/android-debug-latest
          SOURCE_DIR=$(mktemp -d)
          trap 'rm -rf "$SOURCE_DIR"' EXIT
          complete=true
          for file in SciCal600-debug.apk SHA256SUMS size.txt build-info.txt; do
            if ! curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
                --connect-timeout 15 --max-time 120 \
                "$PUBLIC_BASE/$file" --output "$SOURCE_DIR/$file"; then
              complete=false
              break
            fi
          done
          if [[ "$complete" == true ]] && (cd "$SOURCE_DIR" && sha256sum --check SHA256SUMS); then
            MIRROR_DIR=dist/downloads/android-debug-latest
            mkdir -p "$MIRROR_DIR"
            cp "$SOURCE_DIR"/* "$MIRROR_DIR/"
          else
            echo '::notice::No existing verified Android mirror was available to preserve.'
          fi

      - name: Deploy production to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=scical600 --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy LMC branch alias
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/lmc --project-name=scical600 --branch=lmc
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy SystemBussing branch alias
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/systembussing --project-name=scical600 --branch=systembussing
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

name: Android APK
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  # Do not interrupt a main-branch run while it may be replacing the rolling
  # public APK. Pull-request validation remains safely cancellable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm preinstalled Android SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --version"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high
      - name: Unit and integration tests
        run: npm test
      - name: Web build
        run: npm run build
      - name: Browser regression tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Prepare native project (including repeat-sync check)
        run: |
          npm run android:sync
          npm run android:sync
      - name: Gradle debug build and lint
        working-directory: android
        env:
          # Every CI build is upgrade-ordered and identifiable in Android's app
          # details. Local builds keep the package.json version and code 1.
          SCICAL_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug --no-daemon
      - name: Verify APK signature, identity and checksum
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/SciCal600-debug.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose artifacts/SciCal600-debug.apk
          "$BUILD_TOOLS/aapt" dump badging artifacts/SciCal600-debug.apk > artifacts/apk-badging.txt
          EXPECTED_VERSION_NAME="$(node -p 'require("./package.json").version')-dev.${GITHUB_RUN_NUMBER}"
          grep "package: name='io.github.justinfromhkg.scical600'" artifacts/apk-badging.txt
          grep "versionCode='${GITHUB_RUN_NUMBER}'" artifacts/apk-badging.txt
          grep "versionName='$EXPECTED_VERSION_NAME'" artifacts/apk-badging.txt
          (cd artifacts && sha256sum SciCal600-debug.apk > SHA256SUMS)
          stat -c '%n %s bytes' artifacts/SciCal600-debug.apk | tee artifacts/size.txt
          cp package-lock.json artifacts/
      - name: Upload installable debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SciCal600-debug
          path: artifacts/
          retention-days: 90
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch offline on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install artifacts/SciCal600-debug.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am force-stop io.github.justinfromhkg.scical600
            adb shell am start -W -n io.github.justinfromhkg.scical600/.MainActivity
            adb shell pidof io.github.justinfromhkg.scical600
            node tests/android-smoke.cjs || (adb logcat -d > artifacts/android-logcat.txt; adb shell dumpsys activity activities > artifacts/android-activity.txt; exit 1)
      - name: Upload Android smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Android-smoke-evidence
          path: |
            artifacts/android-offline.png
            artifacts/android-logcat.txt
            artifacts/android-activity.txt
          if-no-files-found: ignore
  release:
    # Reserved for a future orchestrated production release. Standalone v* tag
    # pushes are intentionally not a trigger, so a debug/client workflow cannot
    # create a misleading Stable/Latest Release before every signing gate passes.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: android-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm preinstalled Android SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --version"
      - run: npm ci --no-audit --no-fund
      - run: npm run android:sync
      - name: Build unsigned release
        env:
          SCICAL_VERSION_CODE: ${{ github.run_number }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          chmod +x android/gradlew
          cd android
          SCICAL_VERSION_NAME="${GITHUB_REF_NAME#v}" ./gradlew assembleRelease lintRelease --no-daemon
      - name: Sign with production secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" && test -n "$EXPECTED_CERT_SHA256"
          trap 'rm -f "$RUNNER_TEMP/scical-release.jks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/scical-release.jks"
          chmod 600 "$RUNNER_TEMP/scical-release.jks"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/scical-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out SciCal600-Android.apk aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs SciCal600-Android.apk | tee signing-certificate.txt
          ACTUAL_CERT_SHA256=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print toupper($2); exit}' signing-certificate.txt | tr -d ':[:space:]')
          NORMALIZED_EXPECTED_CERT_SHA256=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')
          test -n "$ACTUAL_CERT_SHA256"
          test "$ACTUAL_CERT_SHA256" = "$NORMALIZED_EXPECTED_CERT_SHA256"
          "$BUILD_TOOLS/aapt" dump badging SciCal600-Android.apk > apk-badging.txt
          EXPECTED_VERSION_NAME="${GITHUB_REF_NAME#v}"
          grep "package: name='io.github.justinfromhkg.scical600'" apk-badging.txt
          grep "versionCode='${GITHUB_RUN_NUMBER}'" apk-badging.txt
          grep "versionName='$EXPECTED_VERSION_NAME'" apk-badging.txt
          sha256sum SciCal600-Android.apk > SHA256SUMS
      - name: Publish stable Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          gh release upload "$RELEASE_TAG" SciCal600-Android.apk SHA256SUMS signing-certificate.txt apk-badging.txt --clobber

  debug-download:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: debug
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://scical600.pages.dev/downloads/android-debug-latest/SciCal600-debug.apk
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: SciCal600-debug
          path: artifacts
      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Publish rolling verified testing APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ROLLING_TAG="android-debug-latest"
          IMMUTABLE_TAG="android-debug-${GITHUB_SHA:0:12}"
          APK_SHA256=$(awk '{print $1; exit}' artifacts/SHA256SUMS)
          APK_SIZE=$(stat -c '%s' artifacts/SciCal600-debug.apk)
          APK_VERSION_CODE=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" artifacts/apk-badging.txt | head -1)
          APK_VERSION_NAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" artifacts/apk-badging.txt | head -1)
          test "$APK_VERSION_CODE" = "$GITHUB_RUN_NUMBER"
          test -n "$APK_VERSION_NAME"
          printf 'commit=%s\nworkflow_run=%s\nfile=SciCal600-debug.apk\nversion_code=%s\nversion_name=%s\nsize_bytes=%s\nsha256=%s\nsigning=development key (not production)\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$APK_VERSION_CODE" "$APK_VERSION_NAME" "$APK_SIZE" "$APK_SHA256" > artifacts/build-info.txt
          printf -v NOTES '%s\n\n%s\n\n%s\n\n%s\n%s\n%s\n%s\n%s\n%s\n%s' \
            'Rolling Android testing build with a public Cloudflare Pages download mirror.' \
            'This APK passed the Web tests, full high-severity dependency audit, Gradle build/lint, signature/package checks, and Android emulator offline checks. It uses a development signing key and is not the production-signed stable app. A different development certificate can require uninstalling an older testing build.' \
            'This mutable channel keeps a fixed download tag; that tag is not the asset source revision. Use the source commit, build-info.txt and immutable per-commit Release below for provenance.' \
            "Source commit: $GITHUB_SHA" \
            "Immutable audit Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$IMMUTABLE_TAG" \
            'Public APK: https://scical600.pages.dev/downloads/android-debug-latest/SciCal600-debug.apk' \
            "Android version: $APK_VERSION_NAME (code $APK_VERSION_CODE)" \
            "APK size: $APK_SIZE bytes" \
            "SHA-256: $APK_SHA256" \
            "Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # Publish the verified build under an immutable per-commit tag before
          # touching the rolling channel. This remains the authenticated audit
          # source even when repository visibility changes.
          if ! gh release view "$IMMUTABLE_TAG" >/dev/null 2>&1; then
            gh release create "$IMMUTABLE_TAG" --target "$GITHUB_SHA" \
              --prerelease --latest=false \
              --title "SciCal600 Android testing build (${GITHUB_SHA:0:12})" \
              --notes "$NOTES"
          fi
          gh release upload "$IMMUTABLE_TAG" \
            artifacts/SciCal600-debug.apk artifacts/SHA256SUMS artifacts/size.txt artifacts/build-info.txt \
            --clobber

          VERIFY_DIR=$(mktemp -d)
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          verify_release_assets() {
            local tag="$1"
            local destination="$VERIFY_DIR/$tag"
            mkdir -p "$destination"
            gh release download "$tag" \
              --pattern 'SciCal600-debug.apk' --pattern 'SHA256SUMS' \
              --dir "$destination" --clobber
            test "$(sha256sum "$destination/SciCal600-debug.apk" | awk '{print $1}')" = "$APK_SHA256"
            cmp -s "$destination/SHA256SUMS" artifacts/SHA256SUMS
            test "$(stat -c '%s' "$destination/SciCal600-debug.apk")" = "$APK_SIZE"
          }

          # Confirm the immutable fallback is byte-for-byte identical before
          # changing any rolling-channel metadata or assets.
          verify_release_assets "$IMMUTABLE_TAG"

          if gh release view "$ROLLING_TAG" >/dev/null 2>&1; then
            # Keep the Release and channel tag in place: never delete/recreate
            # it. Publish the verified immutable fallback in its notes before
            # replacing any mutable assets.
            gh release edit "$ROLLING_TAG" \
              --title 'SciCal600 Android APK · verified testing channel' \
              --notes "$NOTES" --prerelease --latest=false
            gh release upload "$ROLLING_TAG" \
              artifacts/SciCal600-debug.apk artifacts/SHA256SUMS artifacts/size.txt artifacts/build-info.txt \
              --clobber
          else
            gh release create "$ROLLING_TAG" \
              artifacts/SciCal600-debug.apk artifacts/SHA256SUMS artifacts/size.txt artifacts/build-info.txt \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title 'SciCal600 Android APK · verified testing channel' --notes "$NOTES"
          fi

          test "$(gh release view "$ROLLING_TAG" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$ROLLING_TAG" --json isPrerelease --jq .isPrerelease)" = true
          verify_release_assets "$ROLLING_TAG"
          gh release view "$ROLLING_TAG" --json tagName,isDraft,isPrerelease,url
      - name: Stage public Android download mirror
        run: |
          set -euo pipefail
          npm run build
          MIRROR_DIR=dist/downloads/android-debug-latest
          mkdir -p "$MIRROR_DIR"
          cp artifacts/SciCal600-debug.apk artifacts/SHA256SUMS artifacts/size.txt artifacts/build-info.txt "$MIRROR_DIR/"
          (cd "$MIRROR_DIR" && sha256sum --check SHA256SUMS)
      - name: Publish public Android download mirror
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=scical600 --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify public Android download mirror
        run: |
          set -euo pipefail
          PUBLIC_BASE=https://scical600.pages.dev/downloads/android-debug-latest
          VERIFY_DIR=$(mktemp -d)
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          verified=false
          for attempt in 1 2 3 4 5; do
            rm -f "$VERIFY_DIR"/*
            if curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
                --connect-timeout 15 --max-time 120 \
                "$PUBLIC_BASE/SciCal600-debug.apk?run=$GITHUB_RUN_ID&attempt=$attempt" \
                --output "$VERIFY_DIR/SciCal600-debug.apk" \
              && curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
                --connect-timeout 15 --max-time 120 \
                "$PUBLIC_BASE/SHA256SUMS?run=$GITHUB_RUN_ID&attempt=$attempt" \
                --output "$VERIFY_DIR/SHA256SUMS" \
              && curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
                --connect-timeout 15 --max-time 120 \
                "$PUBLIC_BASE/build-info.txt?run=$GITHUB_RUN_ID&attempt=$attempt" \
                --output "$VERIFY_DIR/build-info.txt" \
              && test "$(sha256sum "$VERIFY_DIR/SciCal600-debug.apk" | awk '{print $1}')" = "$(awk '{print $1; exit}' artifacts/SHA256SUMS)" \
              && cmp -s "$VERIFY_DIR/SHA256SUMS" artifacts/SHA256SUMS \
              && cmp -s "$VERIFY_DIR/build-info.txt" artifacts/build-info.txt; then
              verified=true
              break
            fi
            sleep $((attempt * 3))
          done
          test "$verified" = true

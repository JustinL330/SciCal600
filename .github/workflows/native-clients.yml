name: Native clients
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-clients-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify brand independence
        run: |
          ! grep -RIn --exclude-dir=.git --exclude=package-lock.json -e 'Casio' -e 'fx-50FH' -e 'FX-50 F' README.md index.html additional-locales.js package.json
      - name: Unit tests
        run: npm test
      - name: Web build
        run: npm run build

  windows:
    needs: migrate-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run desktop:pack -- --win portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SciCal600-Windows
          path: release/*.exe
          retention-days: 90

  macos:
    needs: migrate-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run desktop:pack -- --mac zip --x64 --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SciCal600-macOS
          path: release/*.zip
          retention-days: 90

  ios:
    needs: migrate-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run ios:sync
      - name: Build iOS simulator app
        run: |
          if [[ -d ios/App/App.xcworkspace ]]; then
            XCODE_CONTAINER=(-workspace ios/App/App.xcworkspace)
          else
            XCODE_CONTAINER=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild "${XCODE_CONTAINER[@]}" -scheme App -configuration Release -sdk iphonesimulator -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent ios/build/Build/Products/Release-iphonesimulator/App.app SciCal600-iOS-Simulator.zip
      - name: Build unsigned physical-device archive
        run: |
          if [[ -d ios/App/App.xcworkspace ]]; then
            XCODE_CONTAINER=(-workspace ios/App/App.xcworkspace)
          else
            XCODE_CONTAINER=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild "${XCODE_CONTAINER[@]}" -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath ios/build/SciCal600.xcarchive CODE_SIGNING_ALLOWED=NO archive
          ditto -c -k --sequesterRsrc --keepParent ios/build/SciCal600.xcarchive SciCal600-iOS-Unsigned-Device-Archive.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SciCal600-iOS
          path: |
            SciCal600-iOS-Simulator.zip
            SciCal600-iOS-Unsigned-Device-Archive.zip
          retention-days: 90

  publish-dev-downloads:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish native development release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="native-dev-${GITHUB_SHA:0:12}"
          NOTES='Development builds sharing the SciCal600 calculation core. Windows is not commercially code-signed and may trigger SmartScreen. macOS is not Developer ID signed/notarized and may require Gatekeeper approval. iOS includes a Simulator build and an unsigned device archive; physical-device IPA installation requires Apple signing/provisioning. Android development APKs are published by the Android workflow.'
          mapfile -d '' RELEASE_FILES < <(find artifacts -maxdepth 2 -type f -print0)
          test "${#RELEASE_FILES[@]}" -gt 0

          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "SciCal600 native development builds (${GITHUB_SHA:0:12})" --notes "$NOTES"
          gh release upload "$TAG" "${RELEASE_FILES[@]}" --clobber
